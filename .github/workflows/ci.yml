name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: "Node ${{ matrix.node }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify dist output
        run: |
          node -e "
            const fs = require('fs');
            ['dist/index.js','dist/index.cjs','dist/changelog/index.js','dist/changelog/index.cjs']
              .forEach(f => fs.accessSync(f));
            console.log('dist output verified');
          "
